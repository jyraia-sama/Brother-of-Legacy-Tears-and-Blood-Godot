<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<!-- Ouvert depuis l'écran d'accueil : en plein écran, sans la barre du navigateur (iPhone et Android) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brothers of Legacy">
<meta name="application-name" content="Brothers of Legacy">
<meta name="theme-color" content="#07040a">
<title>Brother of Legacy : Tears and Blood</title>
<!--
	PAGE DE CHARGEMENT DU JEU WEB (modèle d'export Godot : Projet > Exporter > Web > HTML > Custom HTML Shell).
	« Le Sceau des Frères se reforme » : pendant le téléchargement du jeu, des larmes bleues et des gouttes de sang tombent
	du haut de l'écran et remplissent les deux moitiés du médaillon au rythme
	du téléchargement. Quand le jeu démarre, il enchaîne sur la fin (le Sceau se ressoude : ecran_chargement.gd).
	Image de fond : docs/chargement.jpg (copie de assets/ui/chargement.png). Médaillon : docs/sceau/*.webp (copies de assets/ui/sceau/).
-->
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #07040a; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#chargement {
	position: fixed; inset: 0; z-index: 5; background: #07040a center / cover no-repeat url("chargement.jpg");
	transition: opacity 0.5s ease;
}
#chargement canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#phrase, #pourcent, #erreur {
	position: absolute; left: 0; right: 0; text-align: center; font-family: Georgia, 'Times New Roman', serif;
	text-shadow: 0 0 8px #000, 0 0 3px #000; padding: 0 16px;
}
#phrase { top: 87%; font-size: clamp(14px, 2.1vh, 22px); color: #d9c7b8; opacity: 0; transition: opacity 1s ease 0.3s; }
#pourcent { top: calc(87% + 2.4em); font-size: clamp(11px, 1.5vh, 15px); color: #b3a097; font-family: sans-serif; }
#erreur {
	display: none; top: 40%; margin: 0 auto; max-width: 560px; background: rgba(40, 8, 12, 0.92); border: 1px solid #9b3943;
	border-radius: 10px; padding: 16px; font-family: sans-serif; font-size: 15px; line-height: 1.4;
}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

</head>
<body>
<canvas id="canvas">Ton navigateur ne gère pas le jeu (canvas).</canvas>
<noscript>JavaScript est nécessaire pour jouer.</noscript>

<div id="chargement">
	<canvas id="sceau"></canvas>
	<div id="phrase"></div>
	<div id="pourcent"></div>
	<div id="erreur"></div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":90045232,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// ------------------------------------------------------------------
	// Le Sceau des Frères (même dessin que dans le jeu : ecran_chargement.gd)
	// ------------------------------------------------------------------
	const PHRASES = [
		"« Je t'avais promis de venir. »",
		"La Larme à l'aîné, le Sang au cadet. Le Sceau aux deux.",
		"Chaque année, la pierre bleue se couvre de rosée.",
		"Le Mal a choisi Kaël. Toi, tu as choisi ton frère.",
		"Deux moitiés d'un même médaillon. Deux moitiés d'une même lignée.",
		"Les Valcendre ne s'agenouillent pas. Ils se relèvent.",
		"Une larme pour ceux qu'on a perdus. Du sang pour ceux qu'on va sauver.",
		"Le domaine a brûlé. La lignée, elle, brûle encore.",
	];
	const LARME = [63, 157, 255], SANG = [209, 20, 38], OR = [217, 166, 74];

	const ecran = document.getElementById('chargement');
	const cv = document.getElementById('sceau');
	const ctx = cv.getContext('2d');
	const txtPourcent = document.getElementById('pourcent');
	const txtPhrase = document.getElementById('phrase');
	const txtErreur = document.getElementById('erreur');
	txtPhrase.textContent = PHRASES[Math.floor(Math.random() * PHRASES.length)];
	requestAnimationFrame(() => { txtPhrase.style.opacity = 1; });

	let cible = 0, niveau = 0, t0 = performance.now(), dernier = t0, prochaine = 0, gouttes = [], actif = true;
	let W = 0, H = 0, dpr = 1;
	function taille() {
		dpr = Math.min(window.devicePixelRatio || 1, 2);
		W = window.innerWidth; H = window.innerHeight;
		cv.width = W * dpr; cv.height = H * dpr;
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	window.addEventListener('resize', taille);
	taille();
	const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
	const eclaircir = (c, k) => c.map((v) => Math.round(v + (255 - v) * k));
	const assombrir = (c, k) => c.map((v) => Math.round(v * (1 - k)));

	// Le médaillon peint (docs/sceau/) : pour chaque moitié, la version vide et le liquide seul
	const LIQ_Y = [0.228, 0.729], CIBLE_X = { '-1': [0.30, 0.46], '1': [0.54, 0.70] };
	const imgs = {};
	['gauche_vide', 'droite_vide', 'gauche_liquide', 'droite_liquide'].forEach((n) => {
		const im = new Image(); im.src = 'sceau/' + n + '.webp'; imgs[n] = im;
	});
	const prete = (im) => im.complete && im.naturalWidth > 0;

	function moitie(cadre, cote, temps) {
		const nom = cote < 0 ? 'gauche' : 'droite';
		const vide = imgs[nom + '_vide'], liq = imgs[nom + '_liquide'];
		if (!prete(vide) || !prete(liq)) return;
		const [x, y, t] = cadre, dx = t * 0.05 * cote;
		ctx.save();
		ctx.translate(x + t / 2 + dx, y + t / 2); ctx.rotate(-cote * 4 * Math.PI / 180); ctx.translate(-t / 2, -t / 2);
		ctx.drawImage(vide, 0, 0, t, t);
		if (niveau > 0.001) {
			const surf = (u) => (LIQ_Y[1] - niveau * (LIQ_Y[1] - LIQ_Y[0]) + (Math.sin(u * 38 + temps * 3.2) * 0.006 + Math.sin(u * 17 - temps * 2.1) * 0.004) * (1 - niveau * 0.6)) * t;
			const sous = (decal) => {
				const pth = new Path2D(); pth.moveTo(0, t);
				for (let k = 0; k <= 40; k++) pth.lineTo(k / 40 * t, surf(k / 40) + decal);
				pth.lineTo(t, t); pth.closePath(); return pth;
			};
			ctx.save(); ctx.clip(sous(0)); ctx.drawImage(liq, 0, 0, t, t); ctx.restore();
			// liseré lumineux à la surface (seulement sur le liquide)
			const bande = new Path2D(); bande.moveTo(0, surf(0));
			for (let k = 0; k <= 40; k++) bande.lineTo(k / 40 * t, surf(k / 40));
			for (let k = 40; k >= 0; k--) bande.lineTo(k / 40 * t, surf(k / 40) + t * 0.014);
			bande.closePath();
			ctx.save(); ctx.clip(bande); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55; ctx.drawImage(liq, 0, 0, t, t); ctx.restore();
		}
		ctx.restore();
	}

	function bezier(a, b, c, t) {
		const u = 1 - t;
		return [u * u * a[0] + 2 * u * t * b[0] + t * t * c[0], u * u * a[1] + 2 * u * t * b[1] + t * t * c[1]];
	}

	function dessiner(now) {
		if (!actif) return;
		const temps = (now - t0) / 1000, dt = Math.min((now - dernier) / 1000, 0.1);
		dernier = now;
		niveau += (cible - niveau) * Math.min(dt * 3, 1);
		ctx.clearRect(0, 0, W, H);
		const cote = Math.min(W, H) * 0.5, cx = W * 0.5, cy = H * 0.53;
		const cadre = [cx - cote / 2, cy - cote / 2, cote], r = cote * 0.27;
		// halos
		for (let i = 0; i < 8; i++) {
			const a = (0.03 + 0.06 * niveau) * (1 - i / 8);
			ctx.fillStyle = rgba(LARME, a); ctx.beginPath(); ctx.arc(cx - r * 0.45, cy, r * (1 + i * 0.16), 0, 7); ctx.fill();
			ctx.fillStyle = rgba(SANG, a); ctx.beginPath(); ctx.arc(cx + r * 0.45, cy, r * (1 + i * 0.16), 0, 7); ctx.fill();
		}
		// cercle de runes
		ctx.strokeStyle = rgba(OR, 0.18 + 0.3 * niveau); ctx.lineWidth = 2;
		for (let k = 0; k < 32; k++) {
			const a0 = temps * 0.18 + k * Math.PI * 2 / 32;
			ctx.beginPath(); ctx.arc(cx, cy, cote * 0.56, a0, a0 + Math.PI / 32); ctx.stroke();
		}
		moitie(cadre, -1, temps);
		moitie(cadre, 1, temps);
		// gouttes qui tombent du haut de l'écran jusqu'à la surface du liquide
		if (niveau < 0.995 && temps >= prochaine) {
			prochaine = temps + 0.12 + Math.random() * 0.16;
			gouttes.push({ cote: Math.random() < 0.5 ? -1 : 1, u: 0, v: 0.8 + Math.random() * 0.3, x: Math.random() });
		}
		gouttes = gouttes.filter((g) => {
			g.u += dt * g.v * (0.5 + g.u * 1.4);
			if (g.u >= 1) return false;
			// chute verticale depuis le haut de l'écran jusqu'à la surface du liquide
			const bx = CIBLE_X[String(g.cote)];
			const surface = LIQ_Y[1] - niveau * (LIQ_Y[1] - LIQ_Y[0]);
			const arr = [cadre[0] + (bx[0] + (bx[1] - bx[0]) * g.x) * cote + cote * 0.05 * g.cote, cadre[1] + surface * cote];
			const col = g.cote < 0 ? LARME : SANG;
			const p = [arr[0], -r * 0.3 + (arr[1] + r * 0.3) * g.u * g.u], vit = 2 * g.u;
			ctx.lineCap = 'round';
			ctx.strokeStyle = rgba(col, 0.35); ctx.lineWidth = r * 0.05;
			ctx.beginPath(); ctx.moveTo(p[0], p[1] - r * (0.15 + 0.6 * vit)); ctx.lineTo(p[0], p[1]); ctx.stroke();
			ctx.strokeStyle = rgba(eclaircir(col, 0.3), 0.6); ctx.lineWidth = r * 0.03;
			ctx.beginPath(); ctx.moveTo(p[0], p[1] - r * (0.08 + 0.3 * vit)); ctx.lineTo(p[0], p[1]); ctx.stroke();
			ctx.fillStyle = rgba(col, 0.18); ctx.beginPath(); ctx.arc(p[0], p[1], r * 0.14, 0, 7); ctx.fill();
			ctx.fillStyle = rgba(col, 0.35); ctx.beginPath(); ctx.arc(p[0], p[1], r * 0.09, 0, 7); ctx.fill();
			ctx.fillStyle = rgba(eclaircir(col, 0.3), 1); ctx.beginPath(); ctx.arc(p[0], p[1], r * 0.055, 0, 7); ctx.fill();
			return true;
		});
		requestAnimationFrame(dessiner);
	}
	requestAnimationFrame(dessiner);

	// Nouvelle version publiée : le service worker la prépare en arrière-plan. Tant que le jeu
	// n'a pas démarré, on l'active tout de suite (la page se recharge sur la nouvelle version) ;
	// sinon elle sera prise au prochain lancement.
	let jeuLance = false;
	if ('serviceWorker' in navigator) {
		navigator.serviceWorker.getRegistration().then((reg) => {
			if (!reg) return;
			const activer = (w) => { if (w && navigator.serviceWorker.controller && !jeuLance) w.postMessage('update'); };
			activer(reg.waiting);
			reg.addEventListener('updatefound', () => {
				const w = reg.installing;
				if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') activer(w); });
			});
			reg.update().catch(() => {});
		}).catch(() => {});
	}

	function fermer() {
		jeuLance = true;
		cible = 1; niveau = 1;
		ecran.style.opacity = 0;
		setTimeout(() => { actif = false; ecran.remove(); }, 550);
	}

	function erreur(err) {
		console.error(err);
		txtErreur.style.display = 'block';
		txtErreur.textContent = (err instanceof Error) ? err.message : (typeof err === 'string' ? err : 'Une erreur inconnue est survenue.');
		txtPourcent.textContent = '';
	}

	// ------------------------------------------------------------------
	// Démarrage du moteur (comme la page d'origine de Godot)
	// ------------------------------------------------------------------
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let reg;
			try { reg = navigator.serviceWorker.getRegistration(); } catch (e) { reg = Promise.reject(new Error('Service worker registration failed.')); }
			Promise.race([
				reg.then((r) => (r != null ? Promise.reject(new Error('Service worker already exists.')) : r)).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(resolve, 2000)),
			]).then(() => window.location.reload()).catch((e) => console.error('Error while registering service worker:', e));
		} else {
			erreur('Ton navigateur ne peut pas lancer le jeu. Il manque :\n' + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					cible = Math.min(current / total, 1);
					txtPourcent.textContent = Math.round(cible * 100) + ' %';
				}
			},
		}).then(fermer, erreur);
	}
}());
</script>
</body>
</html>
